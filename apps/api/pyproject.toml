[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "panelmind-api"
version = "0.1.0"
description = "PanelMind API — FastAPI + LangGraph multi-agent orchestration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PanelMind contributors" }]
keywords = ["startup", "pitch", "multi-agent", "langgraph", "open-source"]

# ─── Runtime dependencies ────────────────────────────────────────
# FastAPI + server
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sse-starlette>=2.1.3",
    # LangGraph
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    # LLM providers (all optional — we use lazy client init)
    "anthropic>=0.39.0",
    "google-genai>=0.2.0",
    "openai>=1.55.0",
    # Persistence
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    # PDF + charts
    "reportlab>=4.2.0",
    "matplotlib>=3.9.0",
    "numpy>=1.26.0",
    # Search + http
    "requests>=2.32.0",
    "httpx>=0.27.0",
    "tavily-python>=0.5.0",
    "duckduckgo-search>=6.2.0",
    # Observability + security (Tier 1 stubs wired in Tier 0c)
    "structlog>=24.4.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-requests",
    "types-PyYAML",
    "pyyaml>=6.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ─── Tooling config ──────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "RET", # flake8-return
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length is handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov-report=term-missing",
]
