[pytest]
# Pytest configuration for PanelMind
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    -ra
    --strict-markers
    --strict-config
    -v
filterwarnings =
    ignore::DeprecationWarning:google.*
    ignore::DeprecationWarning:pydantic.*