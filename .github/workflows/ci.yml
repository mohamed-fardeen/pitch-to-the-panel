name: CI

on:
  push:
    branches: [main, fix, tier-*, tier-*]
  pull_request:
    branches: [main, fix]

jobs:
  # ─── Backend (Python) ──────────────────────────────────────────
  backend:
    name: Backend (lint + typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            apps/api/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ../apps/api
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov ruff mypy types-PyYAML pyyaml slowapi
        working-directory: backend

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy . || echo "mypy warnings present (non-blocking)"

      - name: Test (pytest)
        env:
          PANELMIND_REPOSITORY: memory
        run: |
          cd ..
          python -m pytest tests/ -v --tb=short --cov=backend/persistence --cov-report=term-missing

  # ─── Frontend (TypeScript) ─────────────────────────────────────
  web:
    name: Web (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        run: corepack enable && corepack prepare pnpm@9.12.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (next lint)
        run: pnpm lint || echo "Lint warnings present (non-blocking)"

      - name: Type check (tsc)
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build
        env:
          # The CI build doesn't need real OAuth keys — we mock the config
          NEXTAUTH_SECRET: ci-build-secret-not-used-in-prod
          NEXTAUTH_URL: http://localhost:3000

  # ─── Docker image smoke test ───────────────────────────────────
  docker:
    name: Docker (image build)
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f Dockerfile.api -t panelmind-api:test .

      - name: Build web image
        run: docker build -f Dockerfile.web -t panelmind-web:test .
